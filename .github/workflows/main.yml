name: Daily Activity

on:
  schedule:
    - cron: "1 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate activity
        run: |
          # Generate random number of commits between 1-15 per day
          COMMITS=$(( $RANDOM % 15 + 1 ))
          
          echo "Date: $(date +%Y-%m-%d), Random Commits: $COMMITS"

          # Configure git
          git config user.name "nzaoo"
          git config user.email "nzaoo@users.noreply.github.com"

          # Create activity file if not exists
          mkdir -p .github/activity
          ACTIVITY_FILE=".github/activity/log.txt"

          # Generate commits
          for i in $(seq 1 $COMMITS); do
            echo "$(date -Iseconds) - Activity entry $i" >> "$ACTIVITY_FILE"
            git add "$ACTIVITY_FILE"
            
            # Natural commit messages
            MESSAGES=(
              "Update dependencies"
              "Fix minor issue"
              "Refactor code"
              "Update docs"
              "Clean up files"
              "Minor improvements"
              "Optimize logic"
              "Update config"
              "Bug fix"
              "Code cleanup"
              "Update tests"
              "Improve performance"
              "Adjust settings"
              "Code review"
              "Format code"
            )
            
            MSG_INDEX=$((RANDOM % ${#MESSAGES[@]}))
            git commit -m "${MESSAGES[$MSG_INDEX]}" --quiet
            
            sleep 2
          done

          # Push all commits at once
          git pull --rebase origin main
          git push --quiet

          echo "Successfully created $COMMITS commits"
